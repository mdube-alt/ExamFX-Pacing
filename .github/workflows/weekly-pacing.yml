name: Weekly pacing update

on:
  schedule:
    # 13:00 UTC Monday = 9am ET / 6am PT, so the numbers are ready first thing.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to pace (YYYY-MM). Defaults to the current month."
        required: false
      as_of:
        description: "Treat this date as today (YYYY-MM-DD). Defaults to today."
        required: false
      dry_run:
        description: "Build the dashboard but do not publish it."
        type: boolean
        default: false
      check_auth_only:
        description: "Only verify the Windsor key and Google access, then stop."
        type: boolean
        default: false

# Pages deployments must not overlap, and a pacing run is cheap to redo.
concurrency:
  group: examfx-pacing
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Warn rather than exit, so the preflight below can report the missing
      # credential as a named fix instead of the job dying here.
      - name: Write service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GOOGLE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Cheap: four one-day Windsor requests and one no-op Sheets call. Turns a
      # missing or read-only credential into a named fix instead of a traceback.
      - name: Verify credentials
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        # `shell: bash` adds -o pipefail, without which `tee` masks a failure.
        shell: bash
        run: python -m examfx_pacing --check-auth | tee preflight.txt

      - name: Publish the preflight
        if: always()
        run: |
          {
            echo '### Credential preflight'
            echo '```'
            cat preflight.txt 2>/dev/null || echo 'the preflight produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The dashboard is the deliverable now; the spreadsheet tabs are no
      # longer written on a schedule. `--write` still does that by hand.
      - name: Build the dashboard
        if: ${{ !inputs.check_auth_only }}
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        # As above: without pipefail, a failed pacing run would report success.
        shell: bash
        run: |
          python -m examfx_pacing \
            ${{ inputs.month && format('--month {0}', inputs.month) || '' }} \
            ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} \
            --dashboard site/index.html \
            --csv site/pacing.csv | tee summary.txt

      - name: Publish the summary
        if: ${{ always() && !inputs.check_auth_only }}
        run: |
          {
            echo '### ExamFX weekly pacing'
            echo '```'
            cat summary.txt 2>/dev/null || echo 'the run produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pacing table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacing-${{ github.run_id }}
          path: |
            site/pacing.csv
            summary.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Package the dashboard for Pages
        if: ${{ !inputs.check_auth_only && !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  # Separate job so the dashboard is only published once the run succeeded.
  publish:
    needs: pace
    if: ${{ !inputs.check_auth_only && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
