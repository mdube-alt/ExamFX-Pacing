name: Weekly pacing update

on:
  schedule:
    # 13:00 UTC Monday = 9am ET / 6am PT, so the numbers are ready first thing.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to pace (YYYY-MM). Defaults to the current month."
        required: false
      as_of:
        description: "Treat this date as today (YYYY-MM-DD). Defaults to today."
        required: false
      dry_run:
        description: "Print the table without writing to the spreadsheet."
        type: boolean
        default: false
      check_auth_only:
        description: "Only verify the Windsor key and Google access, then stop."
        type: boolean
        default: false

concurrency:
  group: examfx-pacing
  cancel-in-progress: false

jobs:
  pace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Warn rather than exit, so the preflight below can report the missing
      # credential as a named fix instead of the job dying here.
      - name: Write service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GOOGLE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Cheap: four one-day Windsor requests and one no-op Sheets call. Turns a
      # missing or read-only credential into a named fix instead of a traceback.
      - name: Verify credentials
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python -m examfx_pacing --check-auth | tee preflight.txt

      - name: Publish the preflight
        if: always()
        run: |
          {
            echo '### Credential preflight'
            echo '```'
            cat preflight.txt 2>/dev/null || echo 'the preflight produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update the pacing tab
        if: ${{ !inputs.check_auth_only }}
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: |
          python -m examfx_pacing \
            ${{ inputs.month && format('--month {0}', inputs.month) || '' }} \
            ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '--write' }} \
            --csv pacing.csv | tee summary.txt

      - name: Publish the summary
        if: ${{ always() && !inputs.check_auth_only }}
        run: |
          {
            echo '### ExamFX weekly pacing'
            echo '```'
            cat summary.txt 2>/dev/null || echo 'the run produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the pacing table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacing-${{ github.run_id }}
          path: |
            pacing.csv
            summary.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
